name: temp apply CI baseline safety repair

on:
  push:
    branches:
      - fix/ci-baseline-safety

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ci-baseline-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Materialize the reviewed repair
        run: python .github/temp_apply_ci_baseline_safety.py

      - name: Verify static safety boundaries
        run: |
          python scripts/check-windows-footguns.py --all
          python scripts/check_subprocess_stdin.py
          python -m py_compile \
            plugins/bounded-engineering/engineering_cli.py \
            plugins/bounded-engineering/create_cli.py \
            plugins/bounded-engineering/plan_cli.py \
            tools/terminal_tool.py \
            tests/tools/test_terminal_env_bridge.py
          git diff --check

      - name: Commit only the permanent repair
        env:
          BRANCH: fix/ci-baseline-safety
        run: |
          rm .github/temp_apply_ci_baseline_safety.py
          rm .github/workflows/temp-apply-ci-baseline-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/bounded-engineering/engineering_cli.py \
            plugins/bounded-engineering/create_cli.py \
            plugins/bounded-engineering/plan_cli.py \
            tools/terminal_tool.py \
            tests/tools/test_terminal_env_bridge.py \
            .github/temp_apply_ci_baseline_safety.py \
            .github/workflows/temp-apply-ci-baseline-safety.yml
          git diff --cached --check
          git commit -m "fix(ci): harden terminal and subprocess boundaries [ci-baseline-applied]"
          git push origin "HEAD:${BRANCH}"
