name: temp tighten P2 hidden-failure contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  tighten:
    if: ${{ github.head_ref == 'p2/real-task-pack' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Materialize strict hidden-failure contract
        run: python .github/temp_tighten_real_task_pack.py

      - name: Verify fail-closed report contract
        run: |
          python -m py_compile .product-truth/real_task_pack.py
          python - <<'PY'
          from __future__ import annotations

          import copy
          import importlib.util
          from pathlib import Path

          path = Path('.product-truth/real_task_pack.py')
          spec = importlib.util.spec_from_file_location('real_task_pack', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def attempt(number: int) -> dict[str, object]:
              return {
                  'attempt': number,
                  'hidden_base': {'returncode': 1},
                  'passed': True,
              }

          tasks = [
              {
                  'id': f'task-{index}',
                  'attempts': [attempt(1), attempt(2)],
                  'gold_reproducible': True,
                  'real_model_oracle_executed': False,
                  'valid': False,
              }
              for index in range(8)
          ]
          report = {
              'schema_version': 1,
              'protocol': module.REPORT_PROTOCOL,
              'tasks': tasks,
              'summary': {
                  'task_count': 8,
                  'gold_reproducible_tasks': 8,
                  'real_model_oracle_tasks': 0,
                  'valid_tasks': 0,
              },
              'claim_boundary': {
                  'gold_control_complete': True,
                  'real_model_oracle_complete': False,
                  'task_pack_ready': False,
                  'product_truth_proven': False,
                  'product_failure_proven': False,
                  'product_maturity': 'Beta',
              },
          }
          module.verify_report(report)
          invalid = copy.deepcopy(report)
          invalid['tasks'][0]['attempts'][0]['hidden_base']['returncode'] = 2
          try:
              module.verify_report(invalid)
          except ValueError as exc:
              assert 'assertion code 1' in str(exc)
          else:
              raise AssertionError('collection/import error was accepted as task RED')
          PY
          git diff --check

      - name: Commit only permanent benchmark change
        env:
          BRANCH: p2/real-task-pack
        run: |
          rm .github/temp_tighten_real_task_pack.py
          rm .github/workflows/temp-tighten-real-task-pack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(p2): require assertion failures for hidden task RED"
          git push origin "HEAD:${BRANCH}"
