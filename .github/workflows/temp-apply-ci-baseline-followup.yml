name: temp apply CI baseline follow-up

on:
  push:
    branches:
      - fix/ci-baseline-safety

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ci-followup-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Materialize reviewed fixes
        run: python .github/temp_apply_ci_baseline_followup.py

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Run focused regressions
        run: |
          python scripts/check-windows-footguns.py --all
          python scripts/check_subprocess_stdin.py
          python -m pytest -q \
            tests/hermes_cli/test_dep_ensure.py \
            tests/hermes_cli/test_config_read_guard.py \
            tests/tools/test_terminal_tool.py \
            tests/tools/test_docker_network_config.py \
            tests/run_agent/test_reset_aware_primary_restore.py \
            tests/plugins/test_bounded_engineering_cli.py \
            tests/plugins/test_bounded_engineering_no_provider_integration.py::test_doctor_fail_closed_and_green_local_fixture_without_running_docker \
            tests/hermes_cli/test_plugins.py::TestPluginDiscovery::test_request_hooks_are_invokeable
          git diff --check

      - name: Commit only permanent changes
        env:
          BRANCH: fix/ci-baseline-safety
        run: |
          rm .github/temp_apply_ci_baseline_followup.py
          rm .github/workflows/temp-apply-ci-baseline-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): repair discovered baseline regressions [ci-followup-applied]"
          git push origin "HEAD:${BRANCH}"
