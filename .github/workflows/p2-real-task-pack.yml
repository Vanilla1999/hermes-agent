name: P2 Hermes real-task gold controls

on:
  pull_request:
    branches: [main]
    paths:
      - '.product-truth/**'
      - 'tests/test_product_truth_benchmark_foundation.py'
      - 'tests/test_product_truth_model_workspace.py'
      - '.github/workflows/p2-real-task-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HERMES_NO_AUTO_INSTALL: "1"

jobs:
  gold-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile benchmark evaluator
        run: |
          python -m py_compile \
            .product-truth/real_task_pack.py \
            .product-truth/oracle_terminal_policy.py \
            .product-truth/model_workspace.py

      - name: Falsify verifier and oracle isolation boundary
        run: |
          python -m pytest -q \
            tests/test_product_truth_benchmark_foundation.py \
            tests/test_product_truth_model_workspace.py

      - name: Run two clean gold controls for all eight tasks
        run: |
          set -euo pipefail
          python .product-truth/real_task_pack.py \
            --manifest .product-truth/real-task-pack.json \
            --output _artifacts/hermes-real-task-gold.json
          python .product-truth/real_task_pack.py \
            --manifest .product-truth/real-task-pack.json \
            --verify-report _artifacts/hermes-real-task-gold.json
          git diff --check

      - name: Upload bounded gold-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-real-task-gold
          path: _artifacts/hermes-real-task-gold.json
          if-no-files-found: error
          retention-days: 7
